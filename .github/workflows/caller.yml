name: caller
on:
  workflow_dispatch:
    inputs:
      env: { type: string, required: false, default: "" }
permissions: { contents: read }
jobs:
  raw:
    uses: ./.github/workflows/r-raw.yml
    with: { environment: "${{ inputs.env }}" }
    secrets: { PROBE: "${{ secrets.PROBE }}", ONLYENV: "${{ secrets.ONLYENV }}" }
  "null":
    uses: ./.github/workflows/r-null.yml
    with: { environment: "${{ inputs.env }}" }
    secrets: { PROBE: "${{ secrets.PROBE }}", ONLYENV: "${{ secrets.ONLYENV }}" }
